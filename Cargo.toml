[package]
name = "apt-manager"
version = "0.6.0"
edition = "2024"

[dependencies]
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_6"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_5"] }
glib = "0.22"
gdk-pixbuf = "0.22"
pango = "0.22"
rust-apt = "0.10.0"
tokio = { version = "1.53.1", features = ["full"] }
libc = "0.2"
